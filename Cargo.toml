[package]
name = "iban-validator-client"
version = "1.0.0"
edition = "2021"
description = "Official high-speed Rust client for Global IBAN, BIC/SWIFT & Bank Routing Validator API via RapidAPI Hub"
readme = "README.md"
authors = ["Noor Mkdad <https://github.com/DrMkdaddy>"]
license = "MIT"
repository = "https://github.com/DrMkdaddy/iban-validator-rust"
homepage = "https://noormkdad.com/tools/iban-validator"
documentation = "https://noormkdad.com/tools/iban-validator"
keywords = ["iban","bic-swift","sepa","iso-13616","mod-97"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "blocking"] }
